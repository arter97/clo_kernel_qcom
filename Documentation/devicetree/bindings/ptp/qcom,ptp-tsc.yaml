%YAML 1.2
---
$id: http://devicetree.org/schemas/ptp/qcom,ptp-tsc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Timestamp Counter(TSC) based PTP clock

maintainers:
  - Taniya Das <quic_tdas@quicinc.com>
  - Sachin Gupta <sachgupt@qti.qualcomm.com>

description:
  TSC module is a timestamp generator, which runs a 64 bit counter for
  system timekeeping.

properties:
  compatible:
    enum:
      - "qcom,tsc"
      - "qcom,tsc-v1"

  reg:
    maxItems: 4
    items:
     - description: TSC reg
     - description: TSC Timer reg
     - description: TSC ETU reg
     - description: TSC Timestamp Mux control reg

  reg-names:
    items:
      - const: tsc
      - const: timer
      - const: etu
      - const: tsc_src_sel

  clocks:
    items:
      - description: TSC AHB clock
      - description: TSC cntr clock
      - description: TSC ETU clock

  clock-names:
    items:
      - const: cfg_ahb
      - const: cntr
      - const: etu

  interrupts:
    maxItems: 2

  interrupt-names:
    items:
      - const: tscss_fusa_irq
      - const: etu_summary_irq

  qcom,tsc-nsec-update:
     description:
       Indicates the TSC counters have values in nanoseconds, rather than
       in secs and nanoseconds.
     type: boolean

  qcom,tsc-frame-pulse-gen:
     description:
       Indicates the TSC supports frame pulse generation which can be used
       for sensors synchronization.
     type: boolean

  qcom,tsc-safety:
     description:
       Indicates that this TSC instance falls has functional-safety (FuSa)
       use cases and requires additional safety handling.
     type: boolean

  qcom,tsc-pipeline-stages:
    description:
      Specifies the number of pipeline stages for this TSC instance.
      If not specified, the default is 24 stages.
    type: integer

patternProperties:
  "^slice[0-9]+$":
    type: object
    description: ETU slice configuration
    properties:
      qcom,etu-event-sel:
        $ref: /schemas/types.yaml#/definitions/uint32
      qcom,etu-slice:
        $ref: /schemas/types.yaml#/definitions/uint32
      qcom,etu-event-name:
        $ref: /schemas/types.yaml#/definitions/string
    required:
      - qcom,etu-event-sel
      - qcom,etu-slice
      - qcom,etu-event-name
    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    tsc: tsc@1c80000 {
      compatible = "qcom,tsc";
      reg = <0x0 0x01c80000 0x0 0x2000>,
            <0x0 0x01c87000 0x0 0x1000>,
            <0x0 0x01ca0000 0x0 0x20000>,
            <0x0 0x01f9e100 0x0 0x4>;
      reg-names = "tsc", "timer", "etu", "tsc_src_sel";
      clocks = <&tscss_ahb_clock>,
	       <&tscss_cntr_clock>,
	       <&tscss_cntr_clock>;
      clock-names = "cfg_ahb",
		    "cntr",
                    "etu";
      qcom,tsc-nsec-update;

      slice@1 {
         qcom,etu-event-sel = <1>;
         qcom,etu-slice = <1>;
         qcom,etu-event-name = "timer0";
      };

      slice@2{
         qcom,etu-event-sel = <2>;
         qcom,etu-slice = <2>;
         qcom,etu-event-name = "timer1";
      };

      slice@3 {
         qcom,etu-event-sel = <3>;
         qcom,etu-slice = <3>;
         qcom,etu-event-name = "timer2";
      };
    };
